[project]
name = "ursache"
version = "0.1.0"
description = "Evidence-grounded assistant for the D4 root-cause step of an 8D investigation in a simulated hot-rolling mill."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.113",
    "cohere>=7.2.0",
    "fastapi>=0.143.1",
    "google-genai>=2.30.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "qdrant-client[fastembed]>=1.19.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlglot>=30.22.0",
    "sse-starlette>=3.5.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ursache = "ursache.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "N"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"src/ursache/migrations/versions/**" = ["E501"]
"src/ursache/db/models/**" = ["RUF012"]
"simulator/**" = ["S311"]
"simulator/questions.py" = ["S608"]

[tool.pyright]
include = ["src", "simulator", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src", "simulator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the Compose services (Postgres, Qdrant)"]
